openapi: 3.0.3

info:
  title: AzerothCore HTTP API
  description: |
    REST interface exposed by the embedded `ModHttpApi` module.
    Designed as a DM companion — all server, player, NPC, creature,
    game object, and world control actions available over HTTP.

    All write operations (POST / DELETE) should only be exposed on a
    trusted internal network; no authentication middleware is included.
  version: 2.0.0
  contact:
    name: Server Administration

servers:
  - url: http://localhost:8080
    description: Local game server

# ---------------------------------------------------------------------------
# Reusable components
# ---------------------------------------------------------------------------
components:
  schemas:

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: player not found

    BoolResult:
      type: object
      properties:
        sent:       { type: boolean }
        teleported: { type: boolean }
        kicked:     { type: boolean }
        despawned:  { type: boolean }
        set:        { type: boolean }

    # ---------- World ----------

    ServerInfo:
      type: object
      properties:
        uptime:            { type: integer, description: Seconds since server start }
        gameTime:          { type: integer, description: Unix timestamp (game clock) }
        startTime:         { type: integer, description: Unix timestamp when server started }
        activeSessions:    { type: integer }
        queuedSessions:    { type: integer }
        playerCount:       { type: integer }
        maxPlayerCount:    { type: integer }
        maxActiveSessions: { type: integer }
        maxQueuedSessions: { type: integer }
        playerLimit:       { type: integer }

    TimeInfo:
      type: object
      properties:
        uptime:    { type: integer }
        gameTime:  { type: integer }
        startTime: { type: integer }

    GroundZResult:
      type: object
      properties:
        z: { type: number, format: float, example: 83.53 }

    ZoneInfo:
      type: object
      properties:
        zoneId:   { type: integer }
        zoneName: { type: string,  example: "Elwynn Forest" }
        areaId:   { type: integer }
        areaName: { type: string,  example: "Northshire Valley" }

    MapInfo:
      type: object
      properties:
        id:             { type: integer }
        name:           { type: string }
        type:           { type: integer }
        isDungeon:      { type: boolean }
        isRaid:         { type: boolean }
        isBattleground: { type: boolean }
        isArena:        { type: boolean }
        instanceable:   { type: boolean }
        maxPlayers:     { type: integer }
        expansion:      { type: integer }

    NearbyResult:
      type: object
      properties:
        creatures:
          type: array
          items: { $ref: '#/components/schemas/NearbyEntity' }
        gameobjects:
          type: array
          items: { $ref: '#/components/schemas/NearbyEntity' }
        total: { type: integer }

    NearbyEntity:
      type: object
      properties:
        guid:  { type: string, example: "0x000000000000002A" }
        entry: { type: integer }
        name:  { type: string }
        x:     { type: number, format: float }
        y:     { type: number, format: float }

    WeatherRequest:
      type: object
      required: [zoneId]
      properties:
        zoneId:
          type: integer
          example: 12
        weatherType:
          type: integer
          description: 0=fine, 1=rain, 2=snow, 3=storm, 86=thunder, 90=black rain
          default: 0
          example: 3
        intensity:
          type: number
          format: float
          description: 0.0 (light) to 1.0 (heavy)
          default: 0.5
          example: 0.8

    # ---------- Players ----------

    Player:
      type: object
      required: [name, guid, mapId, x, y, z, orientation, level, race, class,
                 gender, health, maxHealth, powerType, power, maxPower,
                 zoneId, areaId, isGM, guildId]
      properties:
        name:        { type: string,  example: Arthas }
        guid:        { type: string,  example: "0x000000000000002A" }
        mapId:       { type: integer, example: 0 }
        x:           { type: number,  format: float, example: -8949.95 }
        y:           { type: number,  format: float, example: -132.49 }
        z:           { type: number,  format: float, example: 83.53 }
        orientation: { type: number,  format: float, example: 0.0 }
        level:       { type: integer, minimum: 1, maximum: 80 }
        race:        { type: integer, description: "ChrRaces.dbc entry" }
        class:       { type: integer, description: "ChrClasses.dbc entry" }
        gender:      { type: integer, enum: [0, 1] }
        health:      { type: integer }
        maxHealth:   { type: integer }
        powerType:   { type: integer }
        power:       { type: integer }
        maxPower:    { type: integer }
        zoneId:      { type: integer }
        areaId:      { type: integer }
        isGM:        { type: boolean }
        guildId:     { type: integer }

    PlayerStats:
      type: object
      properties:
        level:        { type: integer }
        experience:
          type: object
          properties:
            current:    { type: integer }
            next_level: { type: integer }
        attributes:
          type: object
          properties:
            strength:  { type: integer }
            agility:   { type: integer }
            stamina:   { type: integer }
            intellect: { type: integer }
            spirit:    { type: integer }
        health:
          type: object
          properties:
            current: { type: integer }
            max:     { type: integer }
        power:
          type: object
          properties:
            mana:        { $ref: '#/components/schemas/PowerPair' }
            rage:        { $ref: '#/components/schemas/PowerPair' }
            energy:      { $ref: '#/components/schemas/PowerPair' }
            focus:       { $ref: '#/components/schemas/PowerPair' }
            happiness:   { $ref: '#/components/schemas/PowerPair' }
            runes:       { $ref: '#/components/schemas/PowerPair' }
            runic_power: { $ref: '#/components/schemas/PowerPair' }
        combat:
          type: object
          properties:
            attack_power:        { type: integer }
            ranged_attack_power: { type: integer }
            spell_power:         { type: integer }
            critical_chance:
              type: object
              properties:
                melee:  { type: number, format: float }
                ranged: { type: number, format: float }
                spell:  { type: number, format: float }
            hit_chance:
              type: object
              properties:
                melee: { type: number, format: float }
                spell: { type: number, format: float }
        resistances:
          $ref: '#/components/schemas/Resistances'
        status:
          $ref: '#/components/schemas/PlayerStatus'
        average_item_level: { type: number, format: float }

    PowerPair:
      type: object
      properties:
        current: { type: integer }
        max:     { type: integer }

    Resistances:
      type: object
      properties:
        armor:  { type: integer }
        holy:   { type: integer }
        fire:   { type: integer }
        nature: { type: integer }
        frost:  { type: integer }
        shadow: { type: integer }
        arcane: { type: integer }

    PlayerStatus:
      type: object
      properties:
        alive:           { type: boolean }
        in_combat:       { type: boolean }
        resting:         { type: boolean }
        ghost:           { type: boolean }
        player_vs_player:{ type: boolean }
        away:            { type: boolean }
        dnd:             { type: boolean }
        gm:              { type: boolean }

    PlayerSkills:
      type: object
      properties:
        passive_skills:
          type: array
          items: { $ref: '#/components/schemas/SkillInfo' }
        talents:
          $ref: '#/components/schemas/TalentInfo'
        castable_spells:
          type: array
          items: { $ref: '#/components/schemas/SpellInfo' }
        spell_count: { type: integer }

    SkillInfo:
      type: object
      properties:
        skill_id:        { type: integer }
        skill_step:      { type: integer }
        current_value:   { type: integer }
        max_value:       { type: integer }
        pure_value:      { type: integer }
        permanent_bonus: { type: integer }
        temporary_bonus: { type: integer }
        name:            { type: string }

    TalentInfo:
      type: object
      properties:
        active_spec:  { type: integer }
        specs_count:  { type: integer }
        talent_points:
          type: object
          properties:
            available: { type: integer }
            used:      { type: integer }
            total:     { type: integer }

    SpellInfo:
      type: object
      properties:
        spell_id:  { type: integer }
        name:      { type: string }
        rank:      { type: string }
        school:    { type: integer }
        cast_time: { type: integer }
        cooldown:  { type: integer }
        range:     { type: number, format: float }

    PlayerQuests:
      type: object
      properties:
        active_quests:
          type: array
          items: { $ref: '#/components/schemas/QuestData' }
        completed_quests:
          type: array
          items: { $ref: '#/components/schemas/QuestData' }
        active_count:    { type: integer }
        completed_count: { type: integer }

    QuestData:
      type: object
      properties:
        quest_id:          { type: integer }
        title:             { type: string }
        description:       { type: string }
        level:             { type: integer }
        min_level:         { type: integer }
        quest_type:        { type: integer }
        suggested_players: { type: integer }
        time_limit:        { type: integer }
        is_daily:          { type: boolean }
        is_weekly:         { type: boolean }
        is_repeatable:     { type: boolean }
        status:            { type: integer }
        item_objectives:
          type: array
          items:
            type: object
            properties:
              item_id:        { type: integer }
              required_count: { type: integer }
              current_count:  { type: integer }
        creature_objectives:
          type: array
          items:
            type: object
            properties:
              npc_or_go_id:   { type: integer }
              required_count: { type: integer }
              current_count:  { type: integer }
        explored:         { type: boolean }
        timer:            { type: integer }
        ready_to_turn_in: { type: boolean }

    PlayerEquipment:
      type: object
      additionalProperties:
        nullable: true
        oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ItemData'

    PlayerInventory:
      type: object
      properties:
        backpack:
          type: array
          items:
            type: object
            properties:
              slot: { type: integer }
              item: { $ref: '#/components/schemas/ItemData' }
        bags:
          type: array
          items:
            type: object
            properties:
              bagSlot:  { type: integer }
              bagEntry: { type: integer }
              bagSlots: { type: integer }
              contents:
                type: array
                items:
                  type: object
                  properties:
                    slot: { type: integer }
                    item: { $ref: '#/components/schemas/ItemData' }
        bank:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  slot: { type: integer }
                  item: { $ref: '#/components/schemas/ItemData' }
            bags:
              type: array
              items:
                type: object
                properties:
                  slot: { type: integer }
                  item: { $ref: '#/components/schemas/ItemData' }

    ItemData:
      type: object
      properties:
        entry:           { type: integer }
        count:           { type: integer }
        name:            { type: string }
        quality:         { type: integer }
        item_level:      { type: integer }
        required_level:  { type: integer }
        class:           { type: integer }
        subclass:        { type: integer }
        inventory_type:  { type: integer }
        durability:      { type: integer }
        max_durability:  { type: integer }
        resistances:     { $ref: '#/components/schemas/Resistances' }
        item_set:        { type: integer }
        bonding:         { type: integer }
        stack_size:      { type: integer }
        sell_price:      { type: integer }
        buy_price:       { type: integer }
        stats:
          type: array
          items:
            type: object
            properties:
              type:  { type: integer }
              value: { type: integer }
        weapon_data:
          type: object
          properties:
            delay:   { type: integer }
            dps:     { type: number, format: float }
            damages:
              type: array
              items:
                type: object
                properties:
                  min:  { type: number, format: float }
                  max:  { type: number, format: float }
                  type: { type: integer }
        sockets:
          type: array
          items:
            type: object
            properties:
              color:   { type: integer }
              content: { type: integer }
        socket_bonus: { type: integer }
        spells:
          type: array
          items:
            type: object
            properties:
              spell_id: { type: integer }
              trigger:  { type: integer }
              charges:  { type: integer }
              cooldown: { type: integer }

    # ---------- Player Management Request Schemas ----------

    TeleportRequest:
      type: object
      required: [name, mapId, x, y, z]
      properties:
        name:        { type: string, example: Arthas }
        mapId:       { type: integer, example: 0 }
        x:           { type: number, format: float }
        y:           { type: number, format: float }
        z:           { type: number, format: float }
        orientation: { type: number, format: float, default: 0.0 }

    ItemRequest:
      type: object
      required: [name, itemEntry]
      properties:
        name:
          type: string
          example: Arthas
        itemEntry:
          type: integer
          description: item_template.entry
          example: 35
        count:
          type: integer
          description: Positive = give, negative = remove.
          default: 1
          example: 5

    VitalRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Arthas }
        vitalType:
          type: string
          enum: [health, mana, rage, focus, energy, runic_power]
          default: health
        value:
          type: integer
          description: Absolute value to set. Pass -1 to restore to maximum.
          default: -1

    KickRequest:
      type: object
      required: [name]
      properties:
        name:   { type: string, example: Griefer }
        reason: { type: string, example: "AFK farming exploit" }

    GmToggleRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Arthas }
        gm:   { type: boolean, default: true, description: true=enable, false=disable }

    CooldownsResetRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Arthas }

    MorphRequest:
      type: object
      required: [name, displayId]
      properties:
        name:      { type: string, example: Arthas }
        displayId: { type: integer, example: 12345, description: Display ID from CreatureDisplayInfo.dbc }

    QuestCompleteRequest:
      type: object
      required: [name, questId]
      properties:
        name:    { type: string, example: Arthas }
        questId: { type: integer, example: 1234 }

    # ---------- Chat ----------

    BroadcastRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: "Server restart in 5 minutes."
        type:
          type: string
          enum: [system, say, yell]
          default: system
          description: |
            - `system` – blue server notification (visible to all)
            - `say`    – positional SAY (requires mapId/x/y/z)
            - `yell`   – positional YELL (requires mapId/x/y/z)
        mapId: { type: integer }
        x:     { type: number, format: float }
        y:     { type: number, format: float }
        z:     { type: number, format: float }

    # ---------- Creatures ----------

    SpawnRequest:
      type: object
      required: [entry]
      properties:
        entry:
          type: integer
          description: Creature template ID (creature_template.entry)
          example: 6
        mapId:
          type: integer
          default: 0
        x:     { type: number, format: float, default: 0.0 }
        y:     { type: number, format: float, default: 0.0 }
        z:
          type: number
          format: float
          default: 0.0
          description: Pass 0 to auto-resolve terrain height.
        orientation: { type: number, format: float, default: 0.0 }
        despawnSecs:
          type: integer
          default: 0
          description: Seconds until automatic despawn; 0 = permanent.
        name:
          type: string
          description: Optional override for the creature display name.

    SpawnResult:
      type: object
      properties:
        guid:     { type: string, example: "0x000000000000002A" }
        guid_raw: { type: integer, format: int64, example: 42 }
        entry:    { type: integer }
        mapId:    { type: integer }
        x:        { type: number, format: float }
        y:        { type: number, format: float }
        z:        { type: number, format: float }

    CreatureTemplate:
      type: object
      properties:
        entry:            { type: integer }
        name:             { type: string }
        subname:          { type: string }
        icon:             { type: string }
        minlevel:         { type: integer }
        maxlevel:         { type: integer }
        faction:          { type: integer }
        npcflag:          { type: integer }
        rank:             { type: integer }
        type:             { type: integer }
        family:           { type: integer }
        unit_class:       { type: integer }
        unit_flags:       { type: integer }
        unit_flags2:      { type: integer }
        models:
          type: array
          items: { type: integer }
        speed_walk:       { type: number, format: float }
        speed_run:        { type: number, format: float }
        health_mod:       { type: number, format: float }
        mana_mod:         { type: number, format: float }
        armor_mod:        { type: number, format: float }
        experience_mod:   { type: number, format: float }
        lootid:           { type: integer }
        pickpocket_loot:  { type: integer }
        skinning_loot:    { type: integer }
        mingold:          { type: integer }
        maxgold:          { type: integer }
        ai_name:          { type: string }
        movement_type:    { type: integer }
        racial_leader:    { type: boolean }
        regenerates_health: { type: boolean }
        flags_extra:      { type: integer }

    NpcSayRequest:
      type: object
      required: [guid, text]
      properties:
        guid:
          type: integer
          format: int64
          description: Raw 64-bit GUID of the spawned creature
          example: 42
        text:
          type: string
          description: Text to speak
          example: "Hello, $N!"
        type:
          type: string
          enum: [say, yell, emote]
          default: say

    # ---------- GameObjects ----------

    GameObjectSpawnRequest:
      type: object
      required: [entry]
      properties:
        entry:
          type: integer
          description: GameObject template ID (gameobject_template.entry)
          example: 1234
        mapId:
          type: integer
          default: 0
        x:     { type: number, format: float, default: 0.0 }
        y:     { type: number, format: float, default: 0.0 }
        z:
          type: number
          format: float
          default: 0.0
          description: Pass 0 to auto-resolve terrain height.
        orientation: { type: number, format: float, default: 0.0 }
        despawnSecs:
          type: integer
          default: 0
          description: Seconds until automatic despawn; 0 = permanent.
        name:
          type: string

  # ---------- Shared Responses ----------

  responses:
    400:
      description: Bad request – missing or invalid parameter
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    404:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    409:
      description: Conflict – e.g. inventory full
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    500:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # =================== World ===================

  /server:
    get:
      operationId: getServerInfo
      summary: Server status and session counts
      tags: [World]
      responses:
        '200':
          description: Server statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerInfo' }

  /time:
    get:
      operationId: getTime
      summary: Server uptime and game time
      tags: [World]
      responses:
        '200':
          description: Time information
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeInfo' }

  /groundz:
    get:
      operationId: getGroundZ
      summary: Terrain height at a map coordinate
      tags: [World]
      parameters:
        - name: map
          in: query
          required: true
          schema: { type: integer }
          example: 0
        - name: x
          in: query
          required: true
          schema: { type: number, format: float }
          example: -8949.95
        - name: y
          in: query
          required: true
          schema: { type: number, format: float }
          example: -132.49
      responses:
        '200':
          description: Ground Z value
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroundZResult' }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /zone:
    get:
      operationId: getZone
      summary: Zone and area info for a world coordinate
      tags: [World]
      parameters:
        - name: map
          in: query
          required: true
          schema: { type: integer }
        - name: x
          in: query
          required: true
          schema: { type: number, format: float }
        - name: y
          in: query
          required: true
          schema: { type: number, format: float }
        - name: z
          in: query
          required: true
          schema: { type: number, format: float }
      responses:
        '200':
          description: Zone and area details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZoneInfo' }
        '400': { $ref: '#/components/responses/400' }

  /maps:
    get:
      operationId: getMaps
      summary: List all maps from DBC
      tags: [World]
      responses:
        '200':
          description: Array of map entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MapInfo' }

  /nearby:
    get:
      operationId: getNearby
      summary: List creatures and game objects near a coordinate
      tags: [World]
      parameters:
        - name: map
          in: query
          required: true
          schema: { type: integer }
          example: 0
        - name: x
          in: query
          required: true
          schema: { type: number, format: float }
          example: -8949.95
        - name: y
          in: query
          required: true
          schema: { type: number, format: float }
          example: -132.49
        - name: range
          in: query
          schema: { type: number, format: float, default: 100 }
          description: Search radius in yards
      responses:
        '200':
          description: Nearby entities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NearbyResult' }

  /weather:
    post:
      operationId: setWeather
      summary: Set weather in a zone
      tags: [World]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeatherRequest' }
            examples:
              storm:
                summary: Storm in Elwynn Forest
                value:
                  zoneId: 12
                  weatherType: 3
                  intensity: 0.8
      responses:
        '200':
          description: Weather updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  weatherSet:  { type: boolean, example: true }
                  zoneId:      { type: integer }
                  weatherType: { type: integer }
                  intensity:   { type: number, format: float }
        '400': { $ref: '#/components/responses/400' }
        '500': { $ref: '#/components/responses/500' }

  # =================== Players ===================

  /player:
    get:
      operationId: getPlayer
      summary: Fetch a single online player by name
      tags: [Players]
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
          example: Arthas
      responses:
        '200':
          description: Player object
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Player' }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /player/stats:
    get:
      operationId: getPlayerStats
      summary: Fetch detailed stats for an online player
      tags: [Players]
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
          example: Arthas
      responses:
        '200':
          description: Player stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerStats' }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /player/skills:
    get:
      operationId: getPlayerSkills
      summary: Fetch skills, talents, and spells for an online player
      tags: [Players]
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
          example: Arthas
      responses:
        '200':
          description: Player skills and spells
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerSkills' }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /player/quests:
    get:
      operationId: getPlayerQuests
      summary: Fetch quest data for an online player
      tags: [Players]
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
          example: Arthas
      responses:
        '200':
          description: Player quests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerQuests' }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /player/equipment:
    get:
      operationId: getPlayerEquipment
      summary: Fetch equipment data for an online player
      tags: [Players]
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
          example: Arthas
      responses:
        '200':
          description: Player equipment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerEquipment' }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /player/inventory:
    get:
      operationId: getPlayerInventory
      summary: Fetch backpack, bags, and bank for an online player
      tags: [Players]
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
          example: Arthas
      responses:
        '200':
          description: Player inventory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerInventory' }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /players:
    get:
      operationId: listPlayers
      summary: List all online players, optionally filtered by location
      tags: [Players]
      parameters:
        - name: map
          in: query
          schema: { type: integer }
          description: Filter to this mapId (requires x and y)
        - name: x
          in: query
          schema: { type: number, format: float }
        - name: y
          in: query
          schema: { type: number, format: float }
        - name: range
          in: query
          schema: { type: number, format: float }
          description: 2-D radius in yards around (x, y). 0 = no range filter.
      responses:
        '200':
          description: Array of player objects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Player' }

  /teleport:
    post:
      operationId: teleportPlayer
      summary: Teleport an online player to given coordinates
      tags: [Players]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeleportRequest' }
            examples:
              teleport:
                summary: Teleport to Orgrimmar
                value: { name: Arthas, mapId: 1, x: 1629.0, y: -4411.0, z: 38.7, orientation: 0 }
      responses:
        '200':
          description: Player teleported
          content:
            application/json:
              schema:
                type: object
                properties:
                  teleported: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /item/give:
    post:
      operationId: modifyItem
      summary: Give or remove an item in a player's inventory
      description: |
        Pass a positive `count` to give items, a negative `count` to remove them.
      tags: [Players]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemRequest' }
            examples:
              give:
                summary: Give 5 Hearthstones
                value: { name: Arthas, itemEntry: 6948, count: 5 }
              remove:
                summary: Remove 1 Hearthstone
                value: { name: Arthas, itemEntry: 6948, count: -1 }
      responses:
        '200':
          description: Item operation successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  player:    { type: string }
                  itemEntry: { type: integer }
                  count:     { type: integer }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }
        '409': { $ref: '#/components/responses/409' }

  /vital:
    post:
      operationId: setVital
      summary: Set a player's health or power to an absolute value
      tags: [Players]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VitalRequest' }
            examples:
              fullHealth:
                summary: Restore Arthas to full health
                value: { name: Arthas, vitalType: health, value: -1 }
              setMana:
                summary: Set mana to 1000
                value: { name: Arthas, vitalType: mana, value: 1000 }
      responses:
        '200':
          description: Vital updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  set: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /kick:
    post:
      operationId: kickPlayer
      summary: Disconnect an online player
      tags: [Players]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KickRequest' }
            examples:
              kick:
                summary: Kick a player
                value: { name: Griefer, reason: "AFK farming exploit" }
      responses:
        '200':
          description: Player kicked
          content:
            application/json:
              schema:
                type: object
                properties:
                  kicked: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /player/gm:
    post:
      operationId: toggleGM
      summary: Enable or disable GM mode for a player
      tags: [Players]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GmToggleRequest' }
            examples:
              enable:
                summary: Enable GM mode
                value: { name: Arthas, gm: true }
              disable:
                summary: Disable GM mode
                value: { name: Arthas, gm: false }
      responses:
        '200':
          description: GM mode toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  gm:   { type: boolean }
                  name: { type: string }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /player/cooldowns/reset:
    post:
      operationId: resetCooldowns
      summary: Reset all spell cooldowns for a player
      tags: [Players]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CooldownsResetRequest' }
            examples:
              reset:
                summary: Reset cooldowns
                value: { name: Arthas }
      responses:
        '200':
          description: Cooldowns reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  cooldownsReset: { type: boolean, example: true }
                  name:          { type: string }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /player/morph:
    post:
      operationId: morphPlayer
      summary: Change a player's display ID (morph)
      tags: [Players]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MorphRequest' }
            examples:
              morph:
                summary: Morph into a Night Elf
                value: { name: Arthas, displayId: 12345 }
      responses:
        '200':
          description: Player morphed
          content:
            application/json:
              schema:
                type: object
                properties:
                  morphed:   { type: boolean, example: true }
                  name:      { type: string }
                  displayId: { type: integer }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /player/quest/complete:
    post:
      operationId: completeQuest
      summary: Force-complete a quest for a player
      tags: [Players]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestCompleteRequest' }
            examples:
              complete:
                summary: Complete quest for Arthas
                value: { name: Arthas, questId: 1234 }
      responses:
        '200':
          description: Quest completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  completed: { type: boolean, example: true }
                  questId:   { type: integer }
                  name:      { type: string }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }
        '500': { $ref: '#/components/responses/500' }

  # =================== Chat ===================

  /broadcast:
    post:
      operationId: broadcast
      summary: Send a message to global or positional chat
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BroadcastRequest' }
            examples:
              system:
                summary: System notification
                value: { message: "Restart in 5 minutes.", type: system }
              say:
                summary: SAY at coordinates
                value:
                  message: "Hail, adventurer!"
                  type: say
                  mapId: 0
                  x: -8949.95
                  y: -132.49
                  z: 83.53
      responses:
        '200':
          description: Message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  # =================== Creatures ===================

  /spawn:
    post:
      operationId: spawnCreature
      summary: Spawn a creature in the world
      tags: [Creatures]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpawnRequest' }
            examples:
              murloc:
                summary: Spawn a Murloc at Northshire
                value:
                  entry: 400
                  mapId: 0
                  x: -8945.0
                  y: -130.0
                  despawnSecs: 300
      responses:
        '200':
          description: Creature spawned; returns its GUID and position
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpawnResult' }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }
        '500': { $ref: '#/components/responses/500' }

  /spawn/{guid}:
    delete:
      operationId: despawnCreature
      summary: Despawn a creature by its raw 64-bit GUID
      tags: [Creatures]
      parameters:
        - name: guid
          in: path
          required: true
          schema: { type: integer, format: int64 }
          example: 42
      responses:
        '200':
          description: Creature despawned
          content:
            application/json:
              schema:
                type: object
                properties:
                  despawned: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  # =================== NPC ===================

  /npc/{entry}:
    get:
      operationId: getNpcInfo
      summary: Lookup creature template information by entry ID
      tags: [NPC]
      parameters:
        - name: entry
          in: path
          required: true
          schema: { type: integer }
          example: 400
      responses:
        '200':
          description: Creature template data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatureTemplate' }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  /npc/say:
    post:
      operationId: npcSay
      summary: Make a spawned creature say, yell, or emote text
      tags: [NPC]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NpcSayRequest' }
            examples:
              say:
                summary: NPC says hello
                value: { guid: 42, text: "Hello, $N!", type: say }
              yell:
                summary: NPC yells a warning
                value: { guid: 42, text: "Intruders!", type: yell }
              emote:
                summary: NPC emotes
                value: { guid: 42, text: "looks around suspiciously", type: emote }
      responses:
        '200':
          description: Message spoken
          content:
            application/json:
              schema:
                type: object
                properties:
                  spoken: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

  # =================== GameObjects ===================

  /gameobject/spawn:
    post:
      operationId: spawnGameObject
      summary: Spawn a game object in the world
      tags: [GameObjects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GameObjectSpawnRequest' }
            examples:
              mailbox:
                summary: Spawn a mailbox
                value:
                  entry: 1234
                  mapId: 0
                  x: -8945.0
                  y: -130.0
                  z: 82.0
                  orientation: 1.5
      responses:
        '200':
          description: GameObject spawned; returns its GUID and position
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpawnResult' }
        '400': { $ref: '#/components/responses/400' }
        '500': { $ref: '#/components/responses/500' }

  /gameobject/spawn/{guid}:
    delete:
      operationId: despawnGameObject
      summary: Despawn a game object by its raw 64-bit GUID
      tags: [GameObjects]
      parameters:
        - name: guid
          in: path
          required: true
          schema: { type: integer, format: int64 }
          example: 58
      responses:
        '200':
          description: GameObject despawned
          content:
            application/json:
              schema:
                type: object
                properties:
                  despawned: { type: boolean, example: true }
        '400': { $ref: '#/components/responses/400' }
        '404': { $ref: '#/components/responses/404' }

# ---------------------------------------------------------------------------
# Tags
# ---------------------------------------------------------------------------
tags:
  - name: World
    description: Server state, maps, terrain, weather, and zone queries
  - name: Players
    description: Query or modify online players
  - name: Chat
    description: Send messages to the game world
  - name: Creatures
    description: Spawn and despawn NPCs / mobs
  - name: NPC
    description: Creature template lookup and NPC dialogue control
  - name: GameObjects
    description: Spawn and despawn world objects
